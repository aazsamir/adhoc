# Same as adhoc.yaml, but with outbound network for the app.
# Needs passt (pacman -S passt), which provides the `pasta` helper.
log_dir: logs

services:
  - name: app
    listen: ["127.0.0.1:8090", "127.0.0.1:8091"]
    internal_port: 8090
    command: ["python3", "examples/dnsapp.py", "{port}"]
    isolation: netns
    net: pasta                    # none (default) | pasta | slirp4netns | custom
    dns: auto                     # relay the host's resolv.conf nameservers
    net_timeout: 5s               # how long to wait for the interface to come up
    idle_timeout: 30s
    startup_timeout: 30s
