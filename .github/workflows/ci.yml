name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: format
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: unit tests
        # The lifecycle suite (tests/lifecycle.rs) needs unprivileged user
        # namespaces, which the runner blocks; it runs via ./e2e/run.sh locally.
        run: cargo test --lib --bins --locked

      - name: build release
        run: cargo build --release --locked
