name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: format
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: unit + integration tests
        # The end-to-end tests need unshare and python3; the runner has both.
        # Tests that need pasta or /dev/net/tun skip themselves.
        run: cargo test --all-targets --locked

      - name: build release
        run: cargo build --release --locked

  e2e:
    # Real namespaces, real fd passing, real apps: the whole suite runs inside
    # the prepared image, once as root and once as an unprivileged user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker e2e (root + rootless)
        run: ./e2e/run.sh
